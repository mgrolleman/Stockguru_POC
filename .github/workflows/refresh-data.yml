name: Refresh stock data
on:
  schedule:
    - cron: '30 5 * * 1-6'   # every morning (05:30 UTC), after the previous US close; Mon-Sat covers Fri close
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python scripts/fetch_data.py data.json
      - name: Commit if changed
        run: |
          git config user.name "data-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet || (git commit -m "Refresh stock data $(date -u +%F)" && git push)
